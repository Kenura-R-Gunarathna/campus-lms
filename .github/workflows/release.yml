name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: campus-lms
            asset_name: campus-lms-linux-x86_64
          - os: windows-latest
            artifact_name: campus-lms.exe
            asset_name: campus-lms-windows-x86_64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libdbus-1-dev libsecret-1-dev libssl-dev libwayland-dev

      - name: Build release
        run: cargo build --release --locked

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/release/${{ matrix.artifact_name }} dist/${{ matrix.asset_name }}
          else
            cp target/release/${{ matrix.artifact_name }} dist/${{ matrix.asset_name }}
            chmod +x dist/${{ matrix.asset_name }}
          fi
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  aur-bin:
    name: Publish AUR (campus-lms-bin)
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: campus-lms-linux-x86_64
          path: /tmp/binary

      - name: Compute SHA256 and version
        id: meta
        run: |
          echo "sha256=$(sha256sum /tmp/binary/campus-lms-linux-x86_64 | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Setup SSH for AUR
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_KEY }}" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          ssh-keyscan -t ed25519,rsa aur.archlinux.org >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur_key
            User aur
            StrictHostKeyChecking accept-new
          EOF
          chmod 600 ~/.ssh/config

      - name: Push campus-lms-bin to AUR
        run: |
          git config --global user.email "kenura.gunarathna@thenex.global"
          git config --global user.name "kenura"

          git clone ssh://aur@aur.archlinux.org/campus-lms-bin.git aur-bin-repo

          # Generate PKGBUILD from template
          sed -e "s/pkgver=.*/pkgver=${{ steps.meta.outputs.version }}/" \
              -e "s/sha256sums=(.*/sha256sums=(/" \
              -e "/sha256sums=(/!b;n;c\\    '${{ steps.meta.outputs.sha256 }}'" \
              PKGBUILD-bin > aur-bin-repo/PKGBUILD
          cp campus-lms.desktop campus-lms-daemon.service aur-bin-repo/
          cp assets/icon.png aur-bin-repo/campus-lms.png

          # Generate .SRCINFO using arch container, capture stdout to host file
          docker run --rm -v "$PWD/aur-bin-repo":/pkg:ro archlinux:base-devel bash -c '
            mkdir -p /tmp/build && cp -r /pkg/. /tmp/build/
            useradd -m -d /home/builder builder
            chown -R builder:builder /tmp/build
            su builder -c "cd /tmp/build && makepkg --printsrcinfo"
          ' > aur-bin-repo/.SRCINFO

          cd aur-bin-repo
          git add .
          git diff --cached --quiet || git commit -m "Release v${{ steps.meta.outputs.version }}"
          git push origin master

  aur-git:
    name: Publish AUR (campus-lms-git)
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        id: meta
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Setup SSH for AUR
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_KEY }}" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          ssh-keyscan -t ed25519,rsa aur.archlinux.org >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur_key
            User aur
            StrictHostKeyChecking accept-new
          EOF
          chmod 600 ~/.ssh/config

      - name: Push campus-lms-git to AUR
        run: |
          git config --global user.email "kenura.gunarathna@thenex.global"
          git config --global user.name "kenura"

          git clone ssh://aur@aur.archlinux.org/campus-lms-git.git aur-git-repo

          cp PKGBUILD campus-lms.desktop campus-lms-daemon.service aur-git-repo/

          docker run --rm -v "$PWD/aur-git-repo":/pkg:ro archlinux:base-devel bash -c '
            mkdir -p /tmp/build && cp -r /pkg/. /tmp/build/
            useradd -m -d /home/builder builder
            chown -R builder:builder /tmp/build
            su builder -c "cd /tmp/build && makepkg --printsrcinfo"
          ' > aur-git-repo/.SRCINFO

          cd aur-git-repo
          git add .
          git diff --cached --quiet || git commit -m "Update from release v${{ steps.meta.outputs.version }}"
          git push origin master
